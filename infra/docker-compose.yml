# Local development infrastructure for the experimentation and assignment service.
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   docker compose --env-file .env -f infra/docker-compose.yml down

name: demo-infra

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: demo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Static admin SPA (../ui at the repo root) served at /{tenant}/login|experiments|analytics.
      - ../ui:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - rabbitmq
      - redis
    networks:
      - demo
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: demo-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_DATABASE: visitorflow
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: demo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - demo
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: demo-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo
    restart: unless-stopped

networks:
  demo:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:
