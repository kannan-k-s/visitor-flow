# Server block — mounted read-only from the host (infra/nginx/conf.d/default.conf).
#
# nginx (port 80) is the single public origin for local development:
#   * it serves the static admin SPA at extensionless, tenant-prefixed routes
#       /{tenant}/login   /{tenant}/experiments   /{tenant}/analytics
#     (files live in ../ui, mounted at /usr/share/nginx/html), and
#   * it reverse-proxies the versioned APIs, the OAuth login dance, the API docs
#     and actuator to the Spring Boot app on the host (host.docker.internal:8080).
#
# The tenant is the first path segment; the SPA reads it from window.location and
# the backend resolves it from /{tenant}/v1/... exactly as before. Reload after edits:
#   docker compose -f infra/docker-compose.yml exec nginx nginx -s reload

upstream app_backend {
  # `host.docker.internal` resolves to the host machine (see extra_hosts in compose).
  server host.docker.internal:8080;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Common reverse-proxy settings, inherited by every proxied location below.
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout    60s;

  # nginx's own health check (does not touch the backend).
  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Local-dev convenience. The SPA is multi-tenant (/{tenant}/...), so bare and
  # tenant-less entry points have no tenant to resolve; these exact-match redirects
  # forward them to the default local tenant so plain http://localhost just works.
  # From /{tenant}/login the page itself forwards an already-signed-in user to
  # /{tenant}/experiments (cookie-aware). Change "demo" if your local tenant differs.
  location = /            { return 302 /demo/login; }
  location = /login       { return 302 /demo/login; }
  location = /experiments { return 302 /demo/experiments; }
  location = /analytics   { return 302 /demo/analytics; }

  # Static SPA assets (css/js). `^~` wins over the regex locations below.
  # `no-cache` = the browser revalidates every time (cheap 304s via ETag/Last-Modified)
  # so edits to the live-mounted ../ui show up on a plain refresh — no stale JS/CSS.
  location ^~ /assets/ {
    access_log off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA pages — extensionless and tenant-prefixed. Each maps to a single static
  # HTML file; the page's JavaScript reads the tenant from the URL.
  location ~ ^/[^/]+/(login|experiments|analytics)/?$ {
    try_files /$1.html =404;
  }

  # Versioned control- and data-plane APIs: /{tenant}/v1/... (includes /v1/auth/login,
  # which the backend turns into the Google OAuth redirect).
  location ~ ^/[^/]+/v1/ {
    proxy_pass http://app_backend;
  }

  # OAuth authorization + callback, API docs, and actuator — all backend-owned.
  location /oauth2/      { proxy_pass http://app_backend; }
  location /login/       { proxy_pass http://app_backend; }
  location /swagger-ui   { proxy_pass http://app_backend; }
  location /v3/api-docs  { proxy_pass http://app_backend; }
  location /actuator/    { proxy_pass http://app_backend; }
}
