# Server block — mounted read-only from the host (infra/nginx/conf.d/default.conf).
# Reverse-proxies to the Spring Boot app running on the host (default port 8080).

upstream app_backend {
  # `host.docker.internal` resolves to the host machine (see extra_hosts in compose).
  server host.docker.internal:8080;
}

server {
  listen 80;
  server_name _;

  # nginx's own health check (does not touch the backend).
  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Everything else is proxied to the application.
  location / {
    proxy_pass         http://app_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
  }
}
