spring.application.name=demo
server.port=8080

# MySQL is the source of truth. Only its password is supplied through the environment.
spring.datasource.url=jdbc:mysql://localhost:3306/visitorflow?connectTimeout=2000&socketTimeout=5000&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis stores tenant/config caches; fixed TTLs bound stale configuration.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=100ms
spring.data.redis.timeout=100ms
spring.cache.type=redis
app.cache.tenant-ttl=5m
app.cache.experiment-ttl=5m

# RabbitMQ durably accepts exposed/converted events; assigned events remain best-effort.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=2s

# Spring Cloud Stream provisions one durable RabbitMQ exchange and consumer-group queue.
spring.cloud.function.definition=trackingEvents
spring.cloud.stream.output-bindings=trackingEvents-out-0
spring.cloud.stream.bindings.trackingEvents-in-0.destination=tracking-events
spring.cloud.stream.bindings.trackingEvents-in-0.group=tracking-events-v0
spring.cloud.stream.bindings.trackingEvents-in-0.content-type=application/json
spring.cloud.stream.bindings.trackingEvents-in-0.consumer.partitioned=true
spring.cloud.stream.bindings.trackingEvents-in-0.consumer.instance-count=4
spring.cloud.stream.bindings.trackingEvents-in-0.consumer.instance-index-list=0,1,2,3
spring.cloud.stream.bindings.trackingEvents-out-0.destination=tracking-events
spring.cloud.stream.bindings.trackingEvents-out-0.content-type=application/json
spring.cloud.stream.bindings.trackingEvents-out-0.producer.partition-key-expression=payload.anonVisitorId
spring.cloud.stream.bindings.trackingEvents-out-0.producer.partition-count=4
spring.cloud.stream.rabbit.bindings.trackingEvents-in-0.consumer.exchange-type=direct
spring.cloud.stream.rabbit.bindings.trackingEvents-in-0.consumer.requeue-rejected=false
spring.cloud.stream.rabbit.bindings.trackingEvents-out-0.producer.exchange-type=direct
spring.cloud.stream.rabbit.bindings.trackingEvents-out-0.producer.transacted=true
app.tracking.max-entries=20

# Assignment limits are part of the public v1 contract.
app.assignment.max-experiments=20
app.assignment.hash-deadline=100ms

# Tenant-scoped OAuth login. The client id is public configuration; only the secret is environmental.
spring.security.oauth2.client.registration.google.client-id=993446548590-827ld2j7tgi3egtn2iia926dqovungr3.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# The JWT signing key is secret; cookie behavior and TTL are ordinary application configuration.
app.security.jwt-signing-secret=${JWT_SIGNING_SECRET}
app.security.jwt-ttl=30m
app.security.oauth-state-ttl=5m
app.security.session-cookie-name=session
app.security.cookie-secure=false
